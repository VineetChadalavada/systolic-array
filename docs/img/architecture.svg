<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 800" width="980" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <linearGradient id="pe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
  </defs>
  <style>
    .h{font-size:20px;font-weight:700;fill:#0f172a}
    .t{font-size:14px;font-weight:600;fill:#0f172a}
    .s{font-size:12px;fill:#475569}
    .m{font-family:Consolas,Menlo,monospace;font-size:11.5px;fill:#334155}
  </style>
  <rect x="1" y="1" width="978" height="798" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="30" y="40" class="h">INT8 weight-stationary systolic array</text>
  <text x="30" y="62" class="s">C = A × B · 8-bit signed inputs, 32-bit accumulation · 4×4 shown, size is a parameter</text>

  <!-- W port + bank control -->
  <rect x="320" y="84" width="435" height="44" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="537" y="104" text-anchor="middle" class="t">W port</text>
  <text x="537" y="120" text-anchor="middle" class="s">one row of B per beat · ROWS beats per tile</text>
  <line x1="537" y1="128" x2="537" y2="146" stroke="#7c3aed" stroke-width="2" marker-end="url(#aP)"/>
  <rect x="320" y="148" width="435" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="537" y="169" text-anchor="middle" class="t">Bank control · double-buffered weights</text>
  <text x="537" y="187" text-anchor="middle" class="m">bank_full[1:0] · bank_fresh[1:0]</text>
  <g stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <line x1="365" y1="198" x2="365" y2="226" marker-end="url(#aP)"/>
    <line x1="480" y1="198" x2="480" y2="226" marker-end="url(#aP)"/>
    <line x1="595" y1="198" x2="595" y2="226" marker-end="url(#aP)"/>
    <line x1="710" y1="198" x2="710" y2="226" marker-end="url(#aP)"/>
  </g>

  <!-- A port + input skew -->
  <rect x="30" y="336" width="120" height="74" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="90" y="364" text-anchor="middle" class="t">A port</text>
  <text x="90" y="382" text-anchor="middle" class="s">one row of A</text>
  <text x="90" y="397" text-anchor="middle" class="s">+ 1-bit bank tag</text>
  <line x1="150" y1="373" x2="172" y2="373" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aB)"/>
  <rect x="174" y="226" width="110" height="342" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="229" y="248" text-anchor="middle" class="t">Input skew</text>
  <text x="229" y="264" text-anchor="middle" class="s">lane k delayed k</text>
  <g fill="#ffffff" stroke="#2563eb" stroke-width="1.5">
    <rect x="257" y="340" width="16" height="16" rx="2"/>
    <rect x="257" y="430" width="16" height="16" rx="2"/><rect x="237" y="430" width="16" height="16" rx="2"/>
    <rect x="257" y="520" width="16" height="16" rx="2"/><rect x="237" y="520" width="16" height="16" rx="2"/><rect x="217" y="520" width="16" height="16" rx="2"/>
  </g>

  <!-- activation arrows into array -->
  <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#aB)">
    <line x1="284" y1="258" x2="318" y2="258"/>
    <line x1="284" y1="348" x2="318" y2="348"/>
    <line x1="284" y1="438" x2="318" y2="438"/>
    <line x1="284" y1="528" x2="318" y2="528"/>
  </g>

  <!-- PE grid: columns x=320,435,550,665 ; rows y=230,320,410,500 -->
  <g id="grid">
    <g stroke="#16a34a" stroke-width="2" fill="url(#pe)">
      <rect x="320" y="230" width="90" height="62" rx="9"/><rect x="435" y="230" width="90" height="62" rx="9"/><rect x="550" y="230" width="90" height="62" rx="9"/><rect x="665" y="230" width="90" height="62" rx="9"/>
      <rect x="320" y="320" width="90" height="62" rx="9"/><rect x="435" y="320" width="90" height="62" rx="9"/><rect x="550" y="320" width="90" height="62" rx="9"/><rect x="665" y="320" width="90" height="62" rx="9"/>
      <rect x="320" y="410" width="90" height="62" rx="9"/><rect x="435" y="410" width="90" height="62" rx="9"/><rect x="550" y="410" width="90" height="62" rx="9"/><rect x="665" y="410" width="90" height="62" rx="9"/>
      <rect x="320" y="500" width="90" height="62" rx="9"/><rect x="435" y="500" width="90" height="62" rx="9"/><rect x="550" y="500" width="90" height="62" rx="9"/><rect x="665" y="500" width="90" height="62" rx="9"/>
    </g>
    <g class="t" text-anchor="middle" font-size="13">
      <text x="365" y="276">PE 0,0</text><text x="480" y="276">PE 0,1</text><text x="595" y="276">PE 0,2</text><text x="710" y="276">PE 0,3</text>
      <text x="365" y="366">PE 1,0</text><text x="480" y="366">PE 1,1</text><text x="595" y="366">PE 1,2</text><text x="710" y="366">PE 1,3</text>
      <text x="365" y="456">PE 2,0</text><text x="480" y="456">PE 2,1</text><text x="595" y="456">PE 2,2</text><text x="710" y="456">PE 2,3</text>
      <text x="365" y="546">PE 3,0</text><text x="480" y="546">PE 3,1</text><text x="595" y="546">PE 3,2</text><text x="710" y="546">PE 3,3</text>
    </g>
    <!-- activations right -->
    <g stroke="#2563eb" stroke-width="2.5" marker-end="url(#aB)">
      <line x1="410" y1="258" x2="433" y2="258"/><line x1="525" y1="258" x2="548" y2="258"/><line x1="640" y1="258" x2="663" y2="258"/>
      <line x1="410" y1="348" x2="433" y2="348"/><line x1="525" y1="348" x2="548" y2="348"/><line x1="640" y1="348" x2="663" y2="348"/>
      <line x1="410" y1="438" x2="433" y2="438"/><line x1="525" y1="438" x2="548" y2="438"/><line x1="640" y1="438" x2="663" y2="438"/>
      <line x1="410" y1="528" x2="433" y2="528"/><line x1="525" y1="528" x2="548" y2="528"/><line x1="640" y1="528" x2="663" y2="528"/>
    </g>
    <!-- partial sums down -->
    <g stroke="#ea580c" stroke-width="2.5" marker-end="url(#aO)">
      <line x1="385" y1="292" x2="385" y2="318"/><line x1="500" y1="292" x2="500" y2="318"/><line x1="615" y1="292" x2="615" y2="318"/><line x1="730" y1="292" x2="730" y2="318"/>
      <line x1="385" y1="382" x2="385" y2="408"/><line x1="500" y1="382" x2="500" y2="408"/><line x1="615" y1="382" x2="615" y2="408"/><line x1="730" y1="382" x2="730" y2="408"/>
      <line x1="385" y1="472" x2="385" y2="498"/><line x1="500" y1="472" x2="500" y2="498"/><line x1="615" y1="472" x2="615" y2="498"/><line x1="730" y1="472" x2="730" y2="498"/>
      <line x1="385" y1="562" x2="385" y2="602"/><line x1="500" y1="562" x2="500" y2="602"/><line x1="615" y1="562" x2="615" y2="602"/><line x1="730" y1="562" x2="730" y2="602"/>
    </g>
  </g>

  <!-- deskew -->
  <rect x="320" y="604" width="435" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="537" y="626" text-anchor="middle" class="t">Output deskew · column n delayed C−1−n</text>
  <g fill="#ffffff" stroke="#d97706" stroke-width="1.5">
    <rect x="357" y="640" width="16" height="16" rx="2"/><rect x="377" y="640" width="16" height="16" rx="2"/><rect x="397" y="640" width="16" height="16" rx="2"/>
    <rect x="482" y="640" width="16" height="16" rx="2"/><rect x="502" y="640" width="16" height="16" rx="2"/>
    <rect x="607" y="640" width="16" height="16" rx="2"/>
  </g>

  <!-- FIFO + C port -->
  <line x1="420" y1="670" x2="420" y2="706" stroke="#475569" stroke-width="2.5" marker-end="url(#aG)"/>
  <rect x="320" y="708" width="200" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="420" y="731" text-anchor="middle" class="t">Result FIFO</text>
  <text x="420" y="749" text-anchor="middle" class="s">2 entries · registered count</text>
  <line x1="520" y1="736" x2="573" y2="736" stroke="#475569" stroke-width="2.5" marker-end="url(#aG)"/>
  <rect x="575" y="708" width="180" height="56" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="665" y="731" text-anchor="middle" class="t">C port</text>
  <text x="665" y="749" text-anchor="middle" class="s">one row of C · COLS × 32 b</text>

  <!-- enable / backpressure -->
  <rect x="30" y="626" width="250" height="78" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="155" y="650" text-anchor="middle" class="t">Global advance enable</text>
  <text x="155" y="668" text-anchor="middle" class="s">high while the FIFO has room</text>
  <text x="155" y="685" text-anchor="middle" class="s">no comb. path c_ready → a_ready</text>
  <path d="M320,750 L155,750 L155,706" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aR)"/>
  <line x1="155" y1="626" x2="155" y2="572" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aR)"/>

  <!-- legend -->
  <rect x="790" y="230" width="166" height="190" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="806" y="254" class="t">Legend</text>
  <line x1="806" y1="278" x2="846" y2="278" stroke="#2563eb" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="856" y="282" class="s">activations →</text>
  <line x1="806" y1="308" x2="846" y2="308" stroke="#ea580c" stroke-width="2.5" marker-end="url(#aO)"/>
  <text x="856" y="312" class="s">partial sums ↓</text>
  <line x1="806" y1="338" x2="846" y2="338" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aP)"/>
  <text x="856" y="342" class="s">weight load</text>
  <line x1="806" y1="368" x2="846" y2="368" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aR)"/>
  <text x="856" y="372" class="s">stall / enable</text>
  <rect x="806" y="390" width="16" height="16" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="830" y="403" class="s">delay register</text>

  <rect x="790" y="440" width="166" height="122" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="806" y="464" class="t">PE(k, n)</text>
  <text x="806" y="484" class="s">holds B[k][n] in two</text>
  <text x="806" y="500" class="s">banks; each row's tag</text>
  <text x="806" y="516" class="s">picks the bank, so old</text>
  <text x="806" y="532" class="s">and new tiles overlap</text>
  <text x="806" y="548" class="s">with no swap cycle</text>

  <rect x="790" y="604" width="166" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="806" y="628" class="t">Latency</text>
  <text x="806" y="648" class="s">ROWS + COLS + 1 cycles</text>
  <text x="806" y="663" class="s">(9 for 4×4, 17 for 8×8)</text>
</svg>
